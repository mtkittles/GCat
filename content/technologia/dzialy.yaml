    bicie i wysięg, imadła, uchwyty tokarskie, kieł.
  icon: mocowanie
  order: 50
- slug: materialy
  title: Materiały
  short: Materiały narzędziowe i obrabiane, skrawalność.
  zakres: >-
    Materiały narzędziowe od HSS do PCD, materiały obrabiane według grup ISO,
    skrawalność, właściwa siła skrawania.
  icon: materialy
  order: 60
- slug: strategie
  title: Strategie obróbki
  short: Obróbka zgrubna i wykańczająca, wejście w materiał, kolejność operacji.
  zakres: >-
    Obróbka zgrubna i wykańczająca, naddatki, wejście po rampie i helisie,
