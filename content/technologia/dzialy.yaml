    szerokość skrawania, wydajność, moc i moment, chropowatość teoretyczna, czas
    maszynowy.
  icon: wzory
  order: 30
- slug: proces
  title: Proces skrawania
  short: Wiór, zużycie ostrza, trwałość, drgania i chłodzenie.
