term: Pc — moc skrawania
anchor: pc-moc-skrawania
order: 810
aliases:
  - Pc
  - moc skrawania
  - moc netto
def: >-
  Moc zużywana na samo skrawanie, w kW. Rośnie z wydajnością Q i z oporem
  właściwym kc materiału. Wymagana moc napędu wrzeciona jest większa: Pc dzieli
  się przez sprawność napędu η z danych maszyny.
formulas:
  - expr: Pc = Q · kc / 60 000
    where:
      - Pc — moc skrawania, kW
      - Q — wydajność skrawania, cm³/min
      - kc — właściwy opór skrawania, N/mm²
    example: 'Q 49,7 cm³/min, kc 1500 N/mm²: Pc = 49,7 · 1500 / 60 000 = 1,24 kW.'
  - expr: Pc = ap · ae · Vf · kc / (60 · 10⁶)
    where:
      - 'frezowanie: ap i ae w mm, Vf w mm/min'
  - expr: Pc = Vc · ap · f · kc / (60 · 10³)
    where:
      - 'toczenie: Vc w m/min, ap w mm, f w mm/obr'
see: []
diagram: ''
sources:
