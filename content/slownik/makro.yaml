def: >-
  Program z parametrami i zmiennymi (#1…#33 lokalne, #100+ wspólne, #500+
  trwałe), wywoływany przez G65 (jednorazowo) lub G66 (modalnie). W makrach
  pisze się własne cykle, pomiary sondą i obliczenia; na Sinumeriku odpowiada im
  podprogram z parametrami i zmienne R.
