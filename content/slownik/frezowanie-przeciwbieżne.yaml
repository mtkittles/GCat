term: Frezowanie przeciwbieżne
anchor: frezowanie-przeciwbieżne
order: 120
aliases:
  - przeciwbieżne
  - conventional milling
def: >-
  Kierunek obrotu w miejscu styku przeciwny do posuwu. Wiór zaczyna się od zera
  grubości, przez co ostrze na początku gniecie materiał. Stosowane na starszych
  maszynach z luzem w śrubie pociągowej i przy naskórku odlewniczym.
