def: >-
  Dwie osie obrotowe ustawiają detal pod kątem i stoją, a skrawa się trzema
  osiami liniowymi. Tak obrabia się pochylone ściany, otwory pod kątem i boki
  detalu z jednego zamocowania. Fanuc: G68.2 + G53.1, Sinumerik: CYCLE800.
