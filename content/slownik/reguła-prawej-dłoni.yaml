term: Reguła prawej dłoni
anchor: reguła-prawej-dłoni
order: 590
aliases:
  - prawa dłoń
  - układ prawoskrętny
def: >-
  Sposób na zapamiętanie zwrotów osi: kciuk prawej dłoni wskazuje +X, palec
  wskazujący +Y, środkowy +Z. Tak zorientowany układ opisuje norma ISO 841 i
  stosują go wszystkie sterowania CNC.
