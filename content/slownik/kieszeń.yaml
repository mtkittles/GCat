term: Kieszeń
anchor: kieszeń
order: 240
aliases:
  - kieszeń prostokątna
  - kieszeń okrągła
  - pocket
def: Wgłębienie w detalu otoczone materiałem ze wszystkich stron. Frez musi wejść w pełny materiał (po spirali, po rampie albo w nawiercony otwór), a potem usuwać materiał przejściami przesuniętymi o ae, kończąc obiegiem ścianki z kompensacją promienia.
see:
