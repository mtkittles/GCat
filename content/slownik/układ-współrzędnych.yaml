term: Układ współrzędnych
anchor: układ-współrzędnych
order: 670
aliases:
  - układ osi
  - osie maszyny
def: >-
  Trzy prostopadłe osie X, Y i Z, względem których podaje się położenie
  narzędzia. Według ISO 841 układ obrabiarki jest prawoskrętny, a dodatni
  kierunek osi Z zwiększa odległość między narzędziem a detalem. Który zespół
  maszyny fizycznie się porusza — stół czy głowica — zależy od jej budowy.
see:
  - g54-g59
