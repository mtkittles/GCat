def: >-
  Poziom w osi Z, powyżej którego narzędzie może swobodnie przejeżdżać nad całym
  stołem — ponad zaciskami, detalem i konikiem. Wszystkie szybkie przejazdy w
  płaszczyźnie XY wykonuje się na tej wysokości.
