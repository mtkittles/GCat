    where: G96 S_ i G97 S_ — stała prędkość skrawania i jej wyłączenie
    loc: rozdz. 3.1, tab. 3.1, s. 73; rozdz. 3.2, tab. 3.2, s. 78; rozdz. 4, s. 92
  - id: fanuc
