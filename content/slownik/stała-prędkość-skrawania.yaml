term: Stała prędkość skrawania
anchor: stała-prędkość-skrawania
order: 640
aliases:
  - CSS
  - G96
  - stała Vc
def: >-
  Tryb, w którym sterowanie zmienia obroty wraz ze średnicą tak, by prędkość
  skrawania była stała. Daje równą chropowatość i trwałość płytki na całym
  profilu; przy wierceniu w osi i gwintowaniu używa się stałych obrotów G97.
formulas:
  - expr: n = 1000 · Vc / (π · D)
    where:
      - n — obroty wrzeciona, obr/min
      - Vc — zadana prędkość skrawania (S przy G96), m/min
      - D — średnica, na której w danej chwili pracuje ostrze, mm
    example: >-
      G96 S200: na ⌀80 mm 796 obr/min, na ⌀20 mm 3183 obr/min, na ⌀2 mm 31 831
      obr/min — dlatego przed G96 ustawia się limit obrotów (na Fanucu w
      systemie A: G50 S…).
see:
  - g96-g97
  - g50
diagram: g96-g97
sources:
