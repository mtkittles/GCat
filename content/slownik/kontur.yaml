term: Kontur
anchor: kontur
order: 300
aliases:
  - profil
  - obrys
def: Linia ograniczająca kształt detalu w płaszczyźnie obróbki, złożona z odcinków i łuków. Program prowadzi po niej środek narzędzia (tor odsunięty o promień) albo samą krawędź przy włączonej kompensacji G41/G42.
see:
  - g40-g42
  - g01
