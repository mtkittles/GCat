term: Cykl stały
anchor: cykl-stały
order: 90
aliases:
  - cykl
  - canned cycle
def: Wbudowana w sterownik sekwencja ruchów, wywoływana jednym blokiem i powtarzana w kolejnych punktach. Cykle wiertarskie (G81–G89) i tokarskie (G70–G76) zastępują kilkanaście bloków jednym.
see:
  - g81-g83
  - g71-g70
