term: n — obroty wrzeciona
anchor: n-obroty-wrzeciona
order: 790
aliases:
  - 'n'
  - obroty
  - obroty wrzeciona
  - prędkość obrotowa
def: >-
  Liczba obrotów wrzeciona na minutę. W programie podaje ją adres S przy stałych
  obrotach (G97). Obroty wylicza się z prędkości skrawania i średnicy. Jeśli
  wynik przekracza maksymalne obroty wrzeciona, w programie wpisuje się maksimum
  i skrawa z mniejszą Vc.
formulas:
  - expr: n = 1000 · Vc / (π · D)
    where:
      - n — obroty wrzeciona, obr/min
      - Vc — prędkość skrawania, m/min
      - >-
        D — średnica narzędzia (frezowanie, wiercenie) albo obrabiana średnica
        detalu (toczenie), mm
    example: >-
      Vc 400 m/min, średnica 100 mm: n = 400 · 1000 / (3,14 · 100) = 1274
      obr/min.
see:
  - m03-m05
  - g96-g97
diagram: f22-limit
