term: Pocienianie wióra
anchor: pocienianie-wióra
order: 460
aliases:
  - chip thinning
def: >-
  Zjawisko występujące przy małym zaangażowaniu bocznym narzędzia (ae mniejsze
  niż połowa średnicy): rzeczywista grubość wióra jest mniejsza niż
  zaprogramowany posuw na ostrze. Bez korekty posuwu narzędzie pracuje zbyt
  lekko, tarcie rośnie kosztem skrawania, a ostrze szybciej się tępi.
formulas:
  - expr: hm ≈ fz · √(ae / D)
    where:
      - hm — średnia grubość wióra, mm
      - fz — posuw na ostrze, mm
      - ae — szerokość skrawania, mm
      - D — średnica freza, mm; wzór dla frezowania bokiem przy ae / D do 0,1
      - 'na rysunku obok: hex — największa grubość wióra'
    example: >-
      Frez ⌀10 mm, ae 1 mm, fz 0,08 mm: hm ≈ 0,08 · √0,1 = 0,025 mm — wiór ponad
      trzy razy cieńszy niż fz.
