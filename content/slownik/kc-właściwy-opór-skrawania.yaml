term: kc — właściwy opór skrawania
anchor: kc-właściwy-opór-skrawania
order: 220
aliases:
  - kc
  - kc1
  - opór skrawania
  - właściwa siła skrawania
def: >-
  Siła skrawania przypadająca na 1 mm² przekroju warstwy skrawanej, w N/mm².
  Zależy od materiału i od grubości wióra: im cieńszy wiór, tym większe kc.
  Kalkulator GCat przyjmuje kc1 bez przeliczenia na grubość wióra, więc przy
  wiórze cieńszym niż 1 mm podaje moc zaniżoną.
formulas:
  - expr: kc = kc1 · hm^(−mc)
    where:
      - kc — właściwy opór skrawania, N/mm²
      - kc1 — wartość dla wióra grubości 1 mm, N/mm²
      - hm — średnia grubość wióra, mm
      - mc — wykładnik zależny od materiału
    example: >-
      Przyjmując kc1 1500 N/mm² i mc 0,25: przy wiórze 0,1 mm kc = 1500 ·
      0,1^(−0,25) ≈ 2670 N/mm², czyli prawie dwa razy więcej niż dla wióra 1 mm.
