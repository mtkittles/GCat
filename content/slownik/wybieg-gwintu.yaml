term: Wybieg gwintu
anchor: wybieg-gwintu
order: 730
aliases:
  - wybieg
  - rozbieg
def: >-
  Odcinek przed gwintem i za nim, potrzebny osiom na rozpędzenie się i
  wyhamowanie przy ruchu zsynchronizowanym z wrzecionem. Zasada: co najmniej dwa
  skoki przed początkiem gwintu. Bez rozbiegu pierwsze zwoje mają zaniżony skok.
