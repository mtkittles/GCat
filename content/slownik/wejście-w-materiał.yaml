term: Wejście w materiał
anchor: wejście-w-materiał
order: 700
aliases:
  - zagłębianie
  - plunge
  - zejście w Z
def: >-
  Ruch, którym narzędzie schodzi na głębokość skrawania. Programuje się go z
  posuwem roboczym (G01) — ruch szybki w materiał grozi kolizją. Posuw zejścia
  jest zwykle mniejszy niż konturowy, bo pracują ostrza czołowe. Frez bez ostrza
  przez środek wymaga rampy albo wejścia po spirali.
see:
