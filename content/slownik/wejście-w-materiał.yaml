term: Wejście w materiał
anchor: wejście-w-materiał
order: 700
aliases:
  - zagłębianie
  - plunge
  - zejście w Z
def: >-
  Ruch, którym narzędzie schodzi na głębokość skrawania. Zawsze na posuwie
  roboczym (G01), nigdy szybkim przejazdem; posuw zejścia jest mniejszy niż
  konturowy, bo pracują ostrza czołowe. Frez bez ostrza przez środek wymaga
  rampy lub wejścia po spirali.
see:
