term: Postój
anchor: postój
order: 490
aliases:
  - dwell
  - postój czasowy
def: >-
  Zaprogramowana przerwa w ruchu osi przy pracującym wrzecionie. Na dnie rowka
  czy otworu wystarczą jeden–dwa obroty wrzeciona; dłuższy postój tylko grzeje i
  wyciera ostrze.
