def: >-
  Punkt, względem którego liczone są wszystkie współrzędne w programie. Jego
  położenie względem zera maszyny zapisuje się w rejestrach G54–G59. Wybór
  miejsca zera wpływa na czytelność programu i łatwość ustawienia detalu.
