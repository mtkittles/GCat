def: >-
  Maksymalne obroty wrzeciona przy stałej prędkości skrawania G96. Bez limitu
  obroty przy osi rosłyby bez końca; G50 S3000 (Fanuc, system A) lub LIMS=3000
  (Sinumerik) trzyma je na wartości bezpiecznej dla uchwytu i detalu.
