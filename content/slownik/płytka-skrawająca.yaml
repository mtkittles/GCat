term: Płytka skrawająca
anchor: płytka-skrawająca
order: 450
aliases:
  - płytka wymienna
  - płytka
  - kod ISO płytki
def: Wymienna końcówka z węglika, ceramiki lub CBN mocowana w oprawce noża lub freza. Kod ISO (np. CNMG 120408) opisuje kształt (C — romb 80°), kąt przyłożenia (N — 0°), tolerancję, typ mocowania, wymiary i promień naroża.
