term: Wysięg narzędzia
anchor: wysięg-narzędzia
order: 905
aliases:
  - wysięg
  - długość wysięgu
  - overhang
  - L/D
def: >-
  Odległość od czoła oprawki do końca narzędzia. Im dłuższy wysięg, tym bardziej
  narzędzie ugina się pod siłą skrawania i tym łatwiej wpada w drgania;
  producent podaje, że od około czterech średnic (4 × D) skłonność do drgań
  rośnie wyraźnie. Zasada: najkrótszy możliwy wysięg i największa średnica
  oprawki, a przy długim wysięgu mały kąt przystawienia (siła osiowa zamiast
  promieniowej), małe zaangażowanie promieniowe i mniejsza głębokość skrawania.
formulas: []
