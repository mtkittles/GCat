term: fz — posuw na ostrze
anchor: fz-posuw-na-ostrze
order: 150
aliases:
  - fz
  - posuw na ząb
def: >-
  Droga, o którą frez przesuwa się między pracą kolejnych ostrzy. Nie jest równa
  grubości wióra — ta zależy też od szerokości skrawania ae i kąta
  przystawienia. Podstawowy parametr doboru posuwu przy frezowaniu: vf = fz · z
  · n.
