def: >-
  Cykl, w którym wiertło schodzi krokami Q, a między krokami wyjeżdża — do
  płaszczyzny R (G83, usuwa wiór) albo tylko o niewielką wartość (G73, łamie
  wiór). Potrzebne w otworach głębszych niż 3–4 średnice.
