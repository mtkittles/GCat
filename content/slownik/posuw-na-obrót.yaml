term: Posuw na obrót
anchor: posuw-na-obrót
order: 510
aliases:
  - mm/obr
  - posuw obrotowy
def: >-
  Jednostka posuwu typowa dla toczenia: droga narzędzia na jeden obrót wrzeciona
  (G95; na tokarce Fanuc w systemie A — G99).
formulas:
  - expr: f = Vf / n
    where:
      - f — posuw na obrót, mm/obr
      - Vf — posuw minutowy, mm/min
      - n — obroty wrzeciona, obr/min
    example: 'Vf 300 mm/min przy 1500 obr/min: f = 300 / 1500 = 0,2 mm/obr.'
  - expr: f = fz · z
    where:
      - fz — posuw na ostrze, mm (frezowanie)
      - z — liczba ostrzy
    example: 'fz 0,08 mm, 4 ostrza: f = 0,32 mm/obr.'
see:
  - g94-g95
  - g98-g99
diagram: feeds
sources:
  - id: sandvik-tg-d
    where: wzory fn = vf / n oraz vf = fz · n · zn (z nich f = fz · z)
    loc: Ogólne wzory frezowania, s. D 23
  - id: sandvik-handbook
    where: posuw fn w mm/obr — ruch narzędzia względem obracającego się detalu
    loc: część A Toczenie, rozdz. Teoria
