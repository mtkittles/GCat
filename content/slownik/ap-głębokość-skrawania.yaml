def: Głębokość, na jaką narzędzie wchodzi w materiał, mierzona wzdłuż osi narzędzia przy frezowaniu i promieniowo przy toczeniu. Wraz z ae i posuwem decyduje o objętości zbieranego materiału i o obciążeniu narzędzia.
