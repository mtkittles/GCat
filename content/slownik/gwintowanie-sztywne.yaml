def: Gwintowanie z elektroniczną synchronizacją obrotu wrzeciona i posuwu osi, bez uchwytu kompensacyjnego. Pozwala na wyższe obroty i daje dokładniejszy gwint. W Fanuc aktywowane przez M29 przed cyklem G84.
see:
