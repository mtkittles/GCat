term: Vc — prędkość skrawania
anchor: vc-prędkość-skrawania
order: 680
aliases:
  - Vc
  - prędkość skrawania
def: >-
  Prędkość, z jaką powierzchnia materiału przesuwa się względem ostrza, w
  metrach na minutę. Zależy od średnicy i obrotów: Vc = π × D × n / 1000. To Vc,
  a nie obroty, dobiera się z katalogu narzędzia dla danego materiału.
see:
  - g96-g97
