term: Kinematyka stół–stół
anchor: kinematyka-stół-stół
order: 250
aliases:
  - trunnion
  - stół uchylny
  - kołyska
def: >-
  Budowa frezarki 5-osiowej, w której obie osie obrotowe są w stole: kołyska A
  albo B pochyla stół, a stół C obraca detal. Wrzeciono zostaje pionowe. Inne
  układy to głowica–głowica i głowica–stół.
